name: Release iOS Demo App

on:
  push:
    branches:
      - main
    paths:
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build IPA
        uses: ./.github/actions/build-ipa
        with:
          certificate_p12_base64: ${{ secrets.MPARTICLE_ENTERPRISE_CERTIFICATE_P12_BASE64 }}
          certificate_password: ${{ secrets.MPARTICLE_ENTERPRISE_CERTIFICATE_PASSPHRASE }}
          provisioning_profile_base64: ${{ secrets.MPARTICLE_ENTERPRISE_PROVISIONING_PROFILE_BASE64 }}

  release-to-github:
    runs-on: macos-latest
    needs: build-ipa
    permissions:
      contents: write
    outputs:
      release_notes: ${{ steps.release-notes.outputs.release_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download IPA artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ipa
          path: .

      - name: Validate release metadata and existing publication
        id: version-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_metadata.py RoktDemo.ipa VERSION --check-release

      - name: Get release notes
        id: release-notes
        run: |
          # Get the commit message of the last merge
          RELEASE_NOTES_DELIMITER="RELEASE_NOTES_$(uuidgen)"
          {
            echo "release_notes<<$RELEASE_NOTES_DELIMITER"
            git log -1 --pretty=%B
            echo "$RELEASE_NOTES_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version-info.outputs.release_exists != 'true'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: RoktDemo.ipa
          artifactErrorsFailBuild: true
          immutableCreate: true
          commit: ${{ github.sha }}
          makeLatest: true
          tag: ${{ steps.version-info.outputs.version_name }}
          body: |
            ## Release notes:
            ${{ steps.release-notes.outputs.release_notes }}

  release-to-firebase:
    runs-on: macos-latest
    needs: release-to-github
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download IPA artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ipa
          path: .

      - name: Upload IPA to Firebase
        uses: ./.github/actions/upload-ipa
        with:
          ipa_path: RoktDemo.ipa
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          firebase_app_id: ${{ secrets.FIREBASE_APP_ID }}
          testing_groups: ${{ secrets.TESTING_GROUPS }}
          release_notes: ${{ needs.release-to-github.outputs.release_notes }}
